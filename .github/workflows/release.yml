name: Static Linux binaries

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Build and verify static linkage
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          nix --extra-experimental-features 'nix-command flakes' build --print-build-logs
          binary=result/bin/blockade
          elf=$(readelf -lW -dW "$binary")
          if grep -Eq 'INTERP|NEEDED' <<< "$elf"; then
            echo 'Blockade has a dynamic interpreter or a shared library dependency' >&2
            exit 1
          fi
          "$binary" --help
          install -Dm755 "$binary" "dist/blockade-$ARCH-linux"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blockade-${{ matrix.arch }}-linux
          path: dist/blockade-${{ matrix.arch }}-linux
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-${{ github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blockade-*-linux
          path: dist
          merge-multiple: true
      - name: Publish binaries and checksums
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum blockade-x86_64-linux blockade-aarch64-linux > SHA256SUMS
          assets=(blockade-x86_64-linux blockade-aarch64-linux SHA256SUMS ../LICENSE)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --generate-notes
          fi
